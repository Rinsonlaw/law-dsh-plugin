<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dsh-git-graph · 预览</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
      background: #0f1115; color: #e6e6e6; font-size: 13px;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }

    .toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.08); flex: none; flex-wrap: wrap; }
    .toolbar .title { font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .toolbar .hint { font-size: 12px; color: #8b94a7; }
    .input { font: inherit; font-size: 12px; color: #e6e6e6; background: #1a1d24; border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 4px 8px; outline: none; }
    .input.path { flex: 1 1 220px; }
    .input.count { width: 104px; }
    .input.search { width: 170px; }
    .input.author { width: 140px; max-width: 160px; }
    .btn { font: inherit; font-size: 12px; color: #e6e6e6; background: #262a33; border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 4px 12px; cursor: pointer; white-space: nowrap; }
    .btn:hover { background: rgba(255,255,255,.06); }
    .btn.primary { background: #4c8dff; border-color: transparent; color: #fff; }
    .btn.icon { padding: 0; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; flex: none; }

    .body { flex: 1; display: flex; min-height: 0; }
    .graph-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: auto; border-right: 1px solid rgba(255,255,255,.08); }
    .graph-scroll { min-width: max-content; }
    .gg-slice { flex: none; display: block; }

    .gg-row { display: flex; align-items: center; gap: 6px; padding: 0 12px 0 6px; cursor: pointer; white-space: nowrap; box-sizing: border-box; border-left: 2px solid transparent; }
    .gg-row:hover { background: rgba(255,255,255,.05); }
    .gg-row.sel { background: rgba(76,141,255,.14); border-left-color: #4c8dff; }
    .gg-subject { overflow: hidden; text-overflow: ellipsis; color: #e6e6e6; }
    .gg-meta { font-size: 11px; color: #8b94a7; flex: none; }
    .gg-ref { display: inline-block; font-size: 10px; line-height: 16px; padding: 0 6px; border-radius: 8px; margin-right: 4px; font-weight: 600; vertical-align: middle; }
    .gg-ref-head { background: #e5484d; color: #fff; }
    .gg-ref-current { background: #8b5cf6; color: #fff; }
    .gg-ref-branch { background: rgba(46,160,67,.25); color: #3fb950; }
    .gg-ref-tag { background: rgba(210,153,34,.22); color: #e3b341; }
    .gg-ref-remote { background: rgba(88,166,255,.18); color: #79b8ff; }

    .detail { flex: 1 1 40%; min-width: 300px; max-width: 46%; overflow: auto; padding: 14px 16px; }
    .detail h3 { margin: 0 0 2px; font-size: 15px; line-height: 22px; font-weight: 600; word-break: break-word; }
    .d-meta { font-size: 12px; color: #8b94a7; margin: 2px 0 10px; }
    .d-body { white-space: pre-wrap; font-size: 12.5px; line-height: 18px; color: #c9d1d9; margin: 0 0 12px; }
    .d-body .gg-inline-code { background: rgba(255,255,255,.08); color: #e6e6e6; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; padding: 1px 5px; border-radius: 4px; border: 1px solid rgba(255,255,255,.08); }
    .d-files h4, .d-diff h4 { margin: 0 0 6px; font-size: 12px; color: #c9d1d9; }
    .d-files { margin: 0 0 14px; }
    .file { display: flex; gap: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 20px; color: #c9d1d9; }
    .file .st { flex: none; width: 26px; text-align: center; border-radius: 3px; font-size: 10px; line-height: 16px; font-weight: 700; margin-top: 2px; }
    .file .st.A { background: rgba(46,160,67,.2); color: #3fb950; }
    .file .st.D { background: rgba(248,81,73,.2); color: #f85149; }
    .file .st.M, .file .st.R { background: rgba(210,153,34,.18); color: #e3b341; }
    .diff { background: #1a1d24; border: 1px solid rgba(255,255,255,.08); border-radius: 8px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 20px; max-height: 420px; }
    .diff .dl { display: block; white-space: pre; padding: 0 12px; min-height: 20px; box-sizing: border-box; }
    .diff .dl-add { background: rgba(63,185,80,.15); color: #3fb950; }
    .diff .dl-del { background: rgba(248,81,73,.15); color: #f85149; }
    .diff .dl-hunk { background: rgba(121,184,255,.12); color: #79b8ff; font-weight: 600; }
    .diff .dl-file { color: #e6e6e6; font-weight: 600; }
    .diff .dl-meta { color: #8b94a7; }
    .diff .dl-ctx { color: #c9d1d9; }
    .empty { color: #8b94a7; padding: 14px 4px; }

    .count-line { flex: none; padding: 4px 12px; font-size: 11px; color: #8b94a7; border-bottom: 1px solid rgba(255,255,255,.06); position: sticky; top: 0; background: #0f1115; z-index: 1; }
    .menu-backdrop { position: fixed; inset: 0; z-index: 100; display: none; }
    .ctx-menu { position: fixed; z-index: 101; min-width: 220px; max-width: 320px; background: #1a1d24; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.5); display: none; }
    .menu-item { display: block; width: 100%; text-align: left; font: inherit; font-size: 12px; color: #e6e6e6; background: transparent; border: none; border-radius: 5px; padding: 6px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu-item:hover { background: rgba(255,255,255,.08); }
    .menu-item.danger { color: #f85149; }
    .menu-sep { height: 1px; margin: 4px 6px; background: rgba(255,255,255,.08); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 102; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; }
    .modal { width: min(440px, 92vw); background: #0f1115; border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.6); display: flex; flex-direction: column; gap: 10px; }
    .modal-title { font-size: 14px; font-weight: 600; }
    .modal-cmd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #c9d1d9; background: #1a1d24; border: 1px solid rgba(255,255,255,.08); border-radius: 6px; padding: 6px 8px; word-break: break-all; }
    .modal-note { font-size: 12px; color: #8b94a7; }
    .modal-input { display: none; }
    .modal-input .input { width: 100%; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn.danger { background: #b62324; border-color: transparent; color: #fff; }
    .toast { position: fixed; bottom: 24px; right: 24px; z-index: 103; padding: 10px 16px; border-radius: 8px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); display: none; }
    .toast.ok { background: rgba(63,185,80,.2); color: #3fb950; border: 1px solid rgba(63,185,80,.3); }
    .toast.err { background: rgba(248,81,73,.2); color: #f85149; border: 1px solid rgba(248,81,73,.3); }
    .toast.warn { background: rgba(227,179,65,.2); color: #e3b341; border: 1px solid rgba(227,179,65,.3); }
  </style>
</head>
<body>

      <input class="input search" id="searchInput" placeholder="搜索提交 / hash / 作者" spellcheck="false" title="搜索" oninput="onSearch(this.value)" />

      <button class="btn primary icon" onclick="render()" title="刷新" aria-label="刷新">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M7.92136 0.349152C10.3744 0.349234 12.5564 1.5052 13.9557 3.29894L15.1281 2.12759C15.3303 1.92546 15.6767 2.06943 15.6767 2.35538V5.53923C15.6766 5.71626 15.5329 5.85976 15.3559 5.86002H12.171C11.8854 5.8597 11.7426 5.51465 11.9443 5.31249L12.9641 4.29056C11.8237 2.74305 9.98908 1.74106 7.92136 1.74097C4.46436 1.74097 1.66233 4.543 1.66233 8C1.66233 11.457 4.46436 14.259 7.92136 14.259C11.3782 14.2589 14.1804 11.4569 14.1804 8H15.5722C15.5722 12.2251 12.1465 15.6507 7.92136 15.6508C3.69614 15.6508 0.270508 12.2252 0.270508 8C0.270508 3.77478 3.69614 0.349152 7.92136 0.349152Z"/></svg>
      </button>
      <span class="hint">这是独立预览页，使用内置模拟提交数据；点任意提交看详情。</span>
    </div>
    <div class="body">
      <div class="graph-col">
        <div class="count-line" id="countLine"></div>
        <div class="graph-scroll" id="graph"></div>
      </div>
      <div class="detail" id="detail">
        <div class="empty">点左侧任意提交，查看信息 / 改动文件 / diff。</div>
      </div>
    </div>
  </div>

  <div class="menu-backdrop" id="menuBackdrop" onclick="closeMenu()"></div>
  <div class="ctx-menu" id="ctxMenu"></div>
  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()">

      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-cmd" id="modalCmd"></div>
      <div class="modal-note" id="modalNote"></div>
      <div class="modal-input" id="modalInputWrap"><input class="input" id="modalInput" placeholder="名称" /></div>
      <div class="modal-actions">

        <button class="btn primary" id="modalConfirm">确认</button>

  </div>
  <div class="toast" id="toast"></div>

  <script>
  // ── 模拟提交数据：git flow 常见分支（新 → 旧，topo 顺序） ──────────────────
  const MOCK_COMMITS = [
    { hash: 'm5', parents: ['m4', 'h2'], subject: "Merge branch 'hotfix/1.0.1' into main", author: 'law', date: '2026-08-16T18:00:00+08:00', refs: ['HEAD -> main', 'origin/main'] },
    { hash: 'd5', parents: ['d4', 'h2'], subject: "Merge branch 'hotfix/1.0.1' into develop", author: 'law', date: '2026-08-16T17:30:00+08:00', refs: ['develop', 'origin/develop'] },
    { hash: 'h2', parents: ['m4'], subject: 'hotfix: fix login crash', author: 'bob', date: '2026-08-16T16:00:00+08:00', refs: ['hotfix/1.0.1'] },
    { hash: 'd4', parents: ['d3', 'r1'], subject: "Merge branch 'release/1.0' into develop", author: 'law', date: '2026-08-15T15:00:00+08:00', refs: [] },
    { hash: 'm4', parents: ['m3', 'r1'], subject: "Merge branch 'release/1.0' into main", author: 'law', date: '2026-08-15T14:30:00+08:00', refs: [] },
    { hash: 'd3', parents: ['d2', 'f2'], subject: "Merge branch 'feature/login' into develop", author: 'law', date: '2026-08-14T12:00:00+08:00', refs: [] },
    { hash: 'r1', parents: ['d2'], subject: 'chore: bump version to 1.0', author: 'law', date: '2026-08-14T10:00:00+08:00', refs: ['release/1.0'] },
    { hash: 'f2', parents: ['f1'], subject: 'feat: add password reset', author: 'alice', date: '2026-08-13T16:00:00+08:00', refs: ['feature/login'] },
    { hash: 'f1', parents: ['d2'], subject: 'feat: add login form', author: 'alice', date: '2026-08-13T14:00:00+08:00', refs: [] },
    { hash: 'm3', parents: ['m2'], subject: 'docs: update README', author: 'law', date: '2026-08-12T11:00:00+08:00', refs: [] },
    { hash: 'd2', parents: ['d1'], subject: 'chore: update dependencies', author: 'law', date: '2026-08-12T10:00:00+08:00', refs: [] },
    { hash: 'm2', parents: ['m1'], subject: 'fix: minor UI bug', author: 'law', date: '2026-08-11T15:00:00+08:00', refs: [] },
    { hash: 'd1', parents: ['base'], subject: 'feat: add user settings', author: 'alice', date: '2026-08-11T14:00:00+08:00', refs: [] },
    { hash: 'm1', parents: ['base'], subject: 'chore: initial main setup', author: 'law', date: '2026-08-11T13:00:00+08:00', refs: [] },
    { hash: 'base', parents: [], subject: 'init: first commit', author: 'law', date: '2026-08-10T09:00:00+08:00', refs: ['tag: v0.1'] },
  ]

  // ── 共享渲染逻辑（由 scripts/build.mjs 内联自 lib/graph.js） ────────────────
  // Pure, framework-agnostic graph rendering for dsh-git-graph.
//
// This module is the SINGLE source of truth for the commit-graph layout and
// HTML/SVG generation. It is shared two ways:
//   - `lib/client.js` (the browser bundle) inlines it via `scripts/build.mjs`;
//   - `preview/preview.html` is generated from it by the same script.
// Nothing in here touches React, the DOM, or the DSH module loader — every
// function is a pure function that returns strings (HTML or SVG).

const ROW_H = 32
const COL_W = 16
const NODE_R = 4.5
const CORNER_R = 5
const PAD_X = 6

// Branch colors (assigned per branch name, high-distinction palette).
const BRANCH_COLORS = [
  '#3b82f6', '#22c55e', '#f59e0b', '#ef4444', '#a855f7',
  '#06b6d4', '#ec4899', '#84cc16', '#f97316', '#14b8a6',
]
const FALLBACK_COLOR = '#8b94a7'

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
}

/** Branch names referenced by a commit's `%D` refs (tags and bare HEAD skipped). */
function branchNames(refs) {
  const names = []
  for (const r of refs) {
    if (!r || r === 'HEAD' || r.startsWith('tag: ')) continue
    let name = r
    if (r.startsWith('HEAD -> ')) name = r.slice(8).trim()
    name = name.replace(/^(origin|upstream|github)\//, '')
    if (name) names.push(name)
  }
  return names
}

/** Branch priority so main/develop/release/hotfix/feature get stable colors. */
function branchRank(name) {
  if (name === 'main' || name === 'master') return 0
  if (name === 'develop' || name === 'dev') return 1
  if (name.startsWith('release')) return 2
  if (name.startsWith('hotfix')) return 3
  if (name.startsWith('feature')) return 4
  return 5
}

/**
 * Stable color per branch: assign colors in priority order, then walk each
 * branch tip's first-parent chain, coloring commits; later branches stop at
 * already-colored commits. Returns Map<hash, color>.
 */
function branchColors(rows) {
  const byHash = new Map(rows.map(r => [r.hash, r]))
  // branch name -> tip hash (first commit carrying that name, newest first)
  const branchTip = new Map()
  rows.forEach(c => {
    for (const name of branchNames(c.refs)) {
      if (!branchTip.has(name)) branchTip.set(name, c.hash)
    }
  })
  const sortedNames = [...branchTip.keys()].sort((a, b) => {
    const ra = branchRank(a), rb = branchRank(b)
    return ra !== rb ? ra - rb : (a < b ? -1 : a > b ? 1 : 0)
  })
  const colorOfBranch = new Map()
  sortedNames.forEach((name, i) => { colorOfBranch.set(name, BRANCH_COLORS[i % BRANCH_COLORS.length]) })
  const colorOf = new Map()
  for (const name of sortedNames) {
    const color = colorOfBranch.get(name)
    let hash = branchTip.get(name)
    while (hash) {
      if (colorOf.has(hash)) break
      colorOf.set(hash, color)
      hash = byHash.get(hash)?.parents[0] ?? null
    }
  }
  rows.forEach(c => { if (!colorOf.has(c.hash)) colorOf.set(c.hash, FALLBACK_COLOR) })
  return colorOf
}

function relTime(iso) {
  const d = new Date(iso)
  if (Number.isNaN(d.getTime())) return ''
  const diff = Date.now() - d.getTime()
  const abs = Math.abs(diff)
  const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' })
  const units = [
    [31_536_000_000, 'year'], [2_592_000_000, 'month'], [86_400_000, 'day'],
    [3_600_000, 'hour'], [60_000, 'minute'], [1_000, 'second'],
  ]
  for (const [ms, unit] of units) {
    if (abs >= ms) return rtf.format(Math.round(-diff / ms), unit)
  }
  return 'just now'
}

function fmtDate(iso) {
  const d = new Date(iso)
  if (Number.isNaN(d.getTime())) return iso
  return d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
}

function refsHtml(refs) {
  if (!Array.isArray(refs) || refs.length === 0) return ''
  return refs.map(r => {
    if (r === 'HEAD') return '<span class="gg-ref gg-ref-head" data-kind="head">HEAD</span>'
    if (r.startsWith('HEAD ->')) {
      const branch = r.slice('HEAD ->'.length).trim()
      const head = '<span class="gg-ref gg-ref-head" data-kind="head">HEAD</span>'
      const b = branch ? `<span class="gg-ref gg-ref-current" data-kind="branch" data-ref="${esc(branch)}">${esc(branch)}</span>` : ''
      return head + b
    }
    if (r.startsWith('tag: ')) return `<span class="gg-ref gg-ref-tag" data-kind="tag" data-ref="${esc(r.slice(5))}">${esc(r.slice(5))}</span>`
    if (r.includes('/')) return `<span class="gg-ref gg-ref-remote" data-kind="remote" data-ref="${esc(r)}">${esc(r)}</span>`
    return `<span class="gg-ref gg-ref-branch" data-kind="branch" data-ref="${esc(r)}">${esc(r)}</span>`
  }).join('')
}

/** Highlight `backtick-quoted` spans in free text (returns escaped HTML). */
function inlineCodeHtml(text) {
  return String(text).split(/(`[^`]+`)/g).map(part => {
    if (part.length >= 2 && part.startsWith('`') && part.endsWith('`')) {
      return '<code class="gg-inline-code">' + esc(part.slice(1, -1)) + '</code>'
    }
    return esc(part)
  }).join('')
}

/** Classify one unified-diff line for syntax highlighting. */
function diffLineClass(line) {
  if (line.startsWith('diff --git')) return 'dl-file'
  if (line.startsWith('index ')) return 'dl-meta'
  if (line.startsWith('---')) return 'dl-file'
  if (line.startsWith('+++')) return 'dl-file'
  if (line.startsWith('@@')) return 'dl-hunk'
  if (line.startsWith('+')) return 'dl-add'
  if (line.startsWith('-')) return 'dl-del'
  if (line.startsWith('\\')) return 'dl-meta'
  return 'dl-ctx'
}

/** Render a unified diff as per-line `<div>` elements with highlighting. */
function diffHtml(diff) {
  return String(diff).replace(/\n+$/, '').split('\n').map(line => {
    const content = line.length > 0 ? esc(line) : '&nbsp;'
    return '<div class="dl ' + diffLineClass(line) + '">' + content + '</div>'
  }).join('')
}

/** Assign each commit a lane column (newest-first topo order). */
function layout(commits) {
  const column = new Map()
  const rowOf = new Map()
  const tips = []
  commits.forEach((c, i) => {
    rowOf.set(c.hash, i)
    let col = tips.indexOf(c.hash)
    if (col === -1) {
      col = tips.length
      tips.push(c.hash)
    }
    column.set(c.hash, col)
    c.parents.forEach((p, pi) => {
      if (pi === 0) {
        tips[col] = p
      } else {
        let pcol = tips.indexOf(p)
        if (pcol === -1) {
          pcol = tips.length
          tips.push(p)
        }
        tips[pcol] = p
      }
    })
  })
  let maxCol = 0
  const rows = commits.map(c => {
    const col = column.get(c.hash) ?? 0
    if (col > maxCol) maxCol = col
    return {
      ...c,
      col,
      parentCols: c.parents.map(p => column.get(p) ?? col),
    }
  })
  return { rows, maxCol, rowOf }
}

/**
 * Compute, for every row, which columns carry a vertical lane line in the
 * top half / bottom half of that row (Map: column → color), plus the elbows
 * (split/merge rounded corners) per row.
 */
function computeLanes(rows, rowOf, colorOf) {
  const n = rows.length
  const top = Array.from({ length: n }, () => new Map())
  const bottom = Array.from({ length: n }, () => new Map())
  const elbows = Array.from({ length: n }, () => [])
  rows.forEach((c, i) => {
    c.parents.forEach((p, pi) => {
      const rp = rowOf.get(p)
      if (rp === undefined) return
      const pc = c.parentCols[pi]
      if (pc === c.col) {
        // first parent, same column: straight lane down
        const color = colorOf.get(c.hash) ?? FALLBACK_COLOR
        bottom[i].set(pc, color)
        for (let r = i + 1; r < rp; r++) { top[r].set(pc, color); bottom[r].set(pc, color) }
        top[rp].set(pc, color)
      } else if (pi === 0) {
        // split: child lane continues UP from the parent. Vertical in the
        // child's column; the horizontal elbow sits in the PARENT's row and
        // turns right-then-up toward the child.
        const color = colorOf.get(c.hash) ?? FALLBACK_COLOR
        bottom[i].set(c.col, color)
        for (let r = i + 1; r < rp; r++) { top[r].set(c.col, color); bottom[r].set(c.col, color) }
        elbows[rp].push({ x1: pc, x2: c.col, color, up: true })
      } else {
        // merge: vertical continues down the merged parent's column; the
        // horizontal elbow sits in THIS row and turns right-then-down.
        const color = colorOf.get(p) ?? FALLBACK_COLOR
        for (let r = i + 1; r < rp; r++) { top[r].set(pc, color); bottom[r].set(pc, color) }
        top[rp].set(pc, color)
        elbows[i].push({ x1: c.col, x2: pc, color, up: false })
      }
    })
  })
  return { top, bottom, elbows }
}

/** One row's elbow: horizontal at the node's level, then rounded corner up or down. */
function elbowSlice(x1, x2, color, up) {
  const dir = x2 > x1 ? 1 : -1
  const y = ROW_H / 2
  const r = Math.max(2, Math.min(CORNER_R, Math.abs(x2 - x1) / 2))
  const endY = up ? 0 : ROW_H
  const qY = up ? y - r : y + r
  return `<path d="M ${x1 + dir * NODE_R} ${y} L ${x2 - dir * r} ${y} Q ${x2} ${y} ${x2} ${qY} L ${x2} ${endY}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/>`
}

/** The graph slice (lane lines + node + elbows) for one commit row. */
function rowSlice(c, i, lanes, colorOf, maxCol) {
  const w = (maxCol + 1) * COL_W + PAD_X * 2
  const cx = col => PAD_X + col * COL_W + COL_W / 2
  const parts = [`<svg class="gg-slice" width="${w}" height="${ROW_H}" viewBox="0 0 ${w} ${ROW_H}" style="position:static;width:${w}px;height:${ROW_H}px;display:block;flex:none;fill:none;stroke:none">`]
  for (let col = 0; col <= maxCol; col++) {
    const tc = lanes.top[i].get(col)
    const bc = lanes.bottom[i].get(col)
    if (tc) parts.push(`<line x1="${cx(col)}" y1="0" x2="${cx(col)}" y2="${ROW_H / 2}" stroke="${tc}" stroke-width="2" stroke-linecap="round"/>`)
    if (bc) parts.push(`<line x1="${cx(col)}" y1="${ROW_H / 2}" x2="${cx(col)}" y2="${ROW_H}" stroke="${bc}" stroke-width="2" stroke-linecap="round"/>`)
  }
  for (const el of lanes.elbows[i]) {
    parts.push(elbowSlice(cx(el.x1), cx(el.x2), el.color, el.up))
  }
  parts.push(`<circle cx="${cx(c.col)}" cy="${ROW_H / 2}" r="${NODE_R}" fill="${colorOf.get(c.hash) ?? FALLBACK_COLOR}" stroke="rgba(0,0,0,.35)" stroke-width="1"/>`)
  parts.push('</svg>')
  return parts.join('')
}

/** Full graph markup: one `.gg-row` per commit, each embedding its graph slice + text. */
function graphHtml(rows, maxCol, rowOf, colorOf, selectedHash) {
  const lanes = computeLanes(rows, rowOf, colorOf)
  return rows.map((c, i) => {
    const refs = refsHtml(c.refs)
    const meta = [c.short ?? c.hash, c.author, relTime(c.date)].filter(Boolean).join(' · ')
    const sel = c.hash === selectedHash ? ' sel' : ''
    return (
      `<div class="gg-row${sel}" data-hash="${esc(c.hash)}" style="height:${ROW_H}px">` +
      rowSlice(c, i, lanes, colorOf, maxCol) +
      refs +
      `<span class="gg-subject">${esc(c.subject || '(no subject)')}</span>` +
      `<span class="gg-meta">${esc(meta)}</span>` +
      `</div>`
    )
  }).join('')
}


  // ── 模拟提交详情 ─────────────────────────────────────────────────────────
  function mockDetail(c) {
    const files = [
      { status: 'M', path: 'src/render.js' },
      { status: 'A', path: 'src/features/' + (c.subject.includes('feat') ? 'feature.js' : 'utils.js') },
      { status: 'D', path: 'legacy/deprecated.js' },
    ]
    const diff = `diff --git a/src/render.js b/src/render.js
index 1234567..89abcde 100644
--- a/src/render.js
+++ b/src/render.js
@@ -1,6 +1,7 @@
 import { mount } from './mount.js'
-import { legacy } from './legacy.js'
+import { init } from './init.js'
 
 export function boot() {
+  init()
   mount()
 }
\\ No newline at end of file
`
    return {
      ...c,
      body: '这是「' + c.subject + '」的模拟提交正文。\n\n修改了 `dsh-git-graph/lib/client.js` 和 `preview/preview.html` 两个文件。\n\n预览页用于离线检查图谱泳道、合并曲线与 refs 标记的渲染效果。',
      files,
      stats: '3 files changed, 12 insertions(+), 4 deletions(-)',
      diff,
    }
  }

  // ── 渲染 ─────────────────────────────────────────────────────────────────
  const graphEl = document.getElementById('graph')
  const detailEl = document.getElementById('detail')
  const countLineEl = document.getElementById('countLine')
  const searchInput = document.getElementById('searchInput')
  const authorSel = document.getElementById('authorSel')
  const menuBackdrop = document.getElementById('menuBackdrop')
  const menuEl = document.getElementById('ctxMenu')
  const modalBackdrop = document.getElementById('modalBackdrop')
  const modalTitle = document.getElementById('modalTitle')
  const modalCmd = document.getElementById('modalCmd')
  const modalNote = document.getElementById('modalNote')
  const modalInputWrap = document.getElementById('modalInputWrap')
  const modalInput = document.getElementById('modalInput')
  const modalConfirm = document.getElementById('modalConfirm')
  const toastEl = document.getElementById('toast')

  let selectedHash = null
  let query = ''
  let authorFilter = ''
  let pendingItem = null
  let toastTimer = null

  // 作者下拉填充
  ;[...new Set(MOCK_COMMITS.map(c => c.author))].sort().forEach(a => {
    const opt = document.createElement('option')
    opt.value = a
    opt.textContent = a
    authorSel.appendChild(opt)
  })

  function baseCommits() {
    const count = Number(document.getElementById('countSel').value) || 0
    return count > 0 ? MOCK_COMMITS.slice(0, count) : MOCK_COMMITS
  }

  function filteredCommits() {
    const q = query.trim().toLowerCase()
    return baseCommits().filter(c => {
      if (authorFilter && c.author !== authorFilter) return false
      if (!q) return true
      return (c.subject || '').toLowerCase().includes(q)
        || (c.hash || '').toLowerCase().includes(q)
        || (c.author || '').toLowerCase().includes(q)
    })
  }

  function onSearch(v) { query = v; render() }
  function onAuthor(v) { authorFilter = v; render() }

  function selectCommit(hash) {
    selectedHash = hash
    graphEl.querySelectorAll('.gg-row').forEach(r => r.classList.toggle('sel', r.dataset.hash === hash))
    const c = MOCK_COMMITS.find(x => x.hash === hash)
    if (c) renderDetail(c)
  }

  function renderDetail(c) {
    const d = mockDetail(c)
    const stClass = s => ({ 'M': 'M', 'A': 'A', 'D': 'D', 'R': 'R' }[s.charAt(0)] || 'M')
    detailEl.innerHTML =
      '<h3>' + esc(d.subject) + '</h3>' +
      '<div class="d-meta">' +
        esc(d.hash + ' · ' + d.author) + ' · ' + esc(fmtDate(d.date)) +
        '<div>' + refsHtml(d.refs) + '</div>' +
      '</div>' +
      '<pre class="d-body">' + inlineCodeHtml(d.body) + '</pre>' +
      '<div class="d-files"><h4>Changed files (' + d.files.length + ')</h4>' +
        d.files.map(f => '<div class="file"><span class="st ' + stClass(f.status) + '">' + esc(f.status.charAt(0)) + '</span><span>' + esc(f.path) + '</span></div>').join('') +
      '</div>' +
      '<div class="d-meta">' + esc(d.stats) + '</div>' +
      '<div class="d-diff"><h4>Diff</h4><div class="diff">' + diffHtml(d.diff) + '</div></div>'
  }

  function render() {
    const commits = filteredCommits()
    const total = baseCommits().length
    if (commits.length === 0) {
      graphEl.innerHTML = '<div class="empty">无匹配提交</div>'
      countLineEl.textContent = `匹配 0 / ${total} commits`
      detailEl.innerHTML = '<div class="empty">无匹配提交。</div>'
      return
    }
    const { rows, maxCol, rowOf } = layout(commits)
    const colorOf = branchColors(rows)
    graphEl.innerHTML = graphHtml(rows, maxCol, rowOf, colorOf, selectedHash)
    countLineEl.textContent = commits.length === total ? `${total} commits` : `匹配 ${commits.length} / ${total} commits`
    graphEl.querySelectorAll('.gg-row').forEach(el => {
      el.addEventListener('click', () => selectCommit(el.dataset.hash))
      el.addEventListener('contextmenu', onRowContextMenu)
    })
    const target = selectedHash && commits.some(c => c.hash === selectedHash) ? selectedHash : commits[0].hash
    selectedHash = target
    graphEl.querySelector(`.gg-row[data-hash="${target}"]`)?.classList.add('sel')
    const c = commits.find(x => x.hash === target)
    if (c) renderDetail(c)
  }

  // ── 右键菜单（mock） ────────────────────────────────────────────────────
  function onRowContextMenu(e) {
    e.preventDefault()
    const rowEl = e.target.closest('.gg-row')
    if (!rowEl) return
    const hash = rowEl.dataset.hash
    const refEl = e.target.closest('.gg-ref')
    const items = []
    if (refEl && refEl.dataset.kind) {
      const kind = refEl.dataset.kind
      const name = refEl.dataset.ref || ''
      if (kind === 'branch' && name) {
        items.push({ label: `切换到 ${name}`, cmd: `git checkout ${name}` })
        items.push({ label: `合并 ${name} 到当前分支`, cmd: `git merge ${name}` })
        items.push({ sep: true })
        items.push({ label: `重命名 ${name}…`, cmd: `git branch -m ${name} <new-name>`, input: true })
        items.push({ label: `删除本地分支 ${name}`, cmd: `git branch -d ${name}` })
        items.push({ label: `删除远程分支 ${name}`, cmd: `git push origin --delete ${name}`, danger: true })
      } else if (kind === 'tag' && name) {
        items.push({ label: `删除 tag ${name}`, cmd: `git tag -d ${name}` })
      }
    } else {
      items.push({ label: '切换到此提交（detached）', cmd: `git checkout --detach ${hash}` })
      items.push({ label: '新建分支…', cmd: `git branch <name> ${hash}`, input: true })
      items.push({ label: '打 tag…', cmd: `git tag <name> ${hash}`, input: true })
      items.push({ sep: true })
      items.push({ label: 'cherry-pick', cmd: `git cherry-pick ${hash}` })
      items.push({ label: 'revert', cmd: `git revert --no-edit ${hash}` })
      items.push({ label: 'reset（--soft）', cmd: `git reset --soft ${hash}` })
      items.push({ label: 'reset（--mixed）', cmd: `git reset --mixed ${hash}` })
      items.push({ label: 'reset（--hard）', cmd: `git reset --hard ${hash}`, danger: true })
    }
    if (items.length === 0) return
    menuEl.innerHTML = ''
    items.forEach(item => {
      if (item.sep) {
        const sep = document.createElement('div')
        sep.className = 'menu-sep'
        menuEl.appendChild(sep)
        return
      }
      const btn = document.createElement('button')
      btn.className = 'menu-item' + (item.danger ? ' danger' : '')
      btn.textContent = item.label
      btn.onclick = () => { closeMenu(); openModal(item) }
      menuEl.appendChild(btn)
    })
    menuEl.style.left = Math.min(e.clientX, window.innerWidth - 240) + 'px'
    menuEl.style.top = Math.min(e.clientY, window.innerHeight - items.length * 30 - 16) + 'px'
    menuEl.style.display = 'block'
    menuBackdrop.style.display = 'block'
  }

  function closeMenu() { menuEl.style.display = 'none'; menuBackdrop.style.display = 'none' }

  function openModal(item) {
    pendingItem = item
    modalTitle.textContent = item.label
    modalCmd.textContent = item.cmd
    modalNote.textContent = item.danger ? '⚠ 高危操作（预览页为模拟演示，不会执行真实 git）' : '预览页为模拟演示，不会执行真实 git 操作。'
    modalInputWrap.style.display = item.input ? 'block' : 'none'
    if (item.input) { modalInput.value = ''; modalInput.focus() }
    modalConfirm.className = 'btn primary' + (item.danger ? ' danger' : '')
    modalBackdrop.style.display = 'flex'
  }

  function closeModal() { modalBackdrop.style.display = 'none' }
  modalConfirm.onclick = () => { closeModal(); showToast('ok', `「${pendingItem.label}」已模拟执行（预览页不操作真实 git）`) }
  modalInput.onkeydown = e => { if (e.key === 'Enter') modalConfirm.click() }

  function showToast(type, text) {
    toastEl.className = 'toast ' + type
    toastEl.textContent = text
    toastEl.style.display = 'block'
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => { toastEl.style.display = 'none' }, 3200)
  }

  // ── 键盘导航 ────────────────────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const commits = filteredCommits()
      if (commits.length === 0) return
      e.preventDefault()
      const idx = selectedHash ? commits.findIndex(c => c.hash === selectedHash) : -1
      let next
      if (idx === -1) next = e.key === 'ArrowDown' ? 0 : commits.length - 1
      else if (e.key === 'ArrowDown') next = Math.min(idx + 1, commits.length - 1)
      else next = Math.max(idx - 1, 0)
      selectCommit(commits[next].hash)
    } else if (e.key === 'Escape') {
      closeMenu(); closeModal()
    }
  })

  render()
  </script>
</body>
</html>
