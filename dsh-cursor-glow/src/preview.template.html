<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>呼吸灯箭头 · 预览</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
      background: radial-gradient(1200px 800px at 50% -10%, #1e293b, #0b1120 60%);
      color: #e2e8f0;
      overflow: hidden;
    }

    .app { display: flex; height: 100%; }

    .panel {
      width: 340px; flex: none; overflow-y: auto;
      padding: 22px 18px;
      background: rgba(15,23,42,.62);
      border-right: 1px solid rgba(148,163,184,.15);
      backdrop-filter: blur(6px);
    }
    .panel-title { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
    .panel-desc { margin-top: 6px; font-size: 12px; line-height: 18px; color: #94a3b8; }

    .group { margin-top: 20px; }
    .group-title { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #e2e8f0; }

    .field { display: flex; flex-direction: column; gap: 6px; padding: 9px 0; border-bottom: 1px solid rgba(148,163,184,.08); }
    .field-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .field-name { display: flex; flex-direction: column; gap: 2px; }
    .field-label { font-size: 12.5px; color: #cbd5e1; }
    .field-hint { font-size: 11px; color: #64748b; }
    .field-value { font-size: 11.5px; color: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    input[type=range] { width: 100%; margin: 0; accent-color: #4c8dff; cursor: pointer; }
    input[type=color] { width: 100%; height: 30px; padding: 1px 2px; border: 1px solid rgba(148,163,184,.2); border-radius: 6px; background: transparent; cursor: pointer; }

    .reset { margin-top: 20px; font: inherit; font-size: 12.5px; color: #e2e8f0; background: rgba(38,42,51,.6); border: 1px solid rgba(148,163,184,.2); border-radius: 6px; padding: 7px 16px; cursor: pointer; }
    .reset:hover { background: rgba(148,163,184,.12); }

    .stage { flex: 1; display: grid; place-items: center; overflow: hidden; }
    .card {
      text-align: center;
      padding: 48px 56px;
      border: 1px solid rgba(148,163,184,.15);
      border-radius: 20px;
      background: rgba(15,23,42,.5);
      backdrop-filter: blur(6px);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.6);
    }
    h1 { font-size: 32px; font-weight: 700; letter-spacing: -.5px; }
    h1 span {
      background: linear-gradient(90deg,#ff5e7e,#ff9d5c,#ffe95c,#5cff9d,#5cd6ff,#a35cff,#ff5cf0);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .card .desc { margin-top: 14px; font-size: 15px; color: #94a3b8; }
    .card .hint { margin-top: 26px; font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel" id="panel">
      <h2 class="panel-title">光标光效</h2>
      <p class="panel-desc">调整自定义光标的箭头、光晕与呼吸动画参数，改动即时生效。</p>
    </aside>
    <main class="stage">
      <div class="card">
        <h1><span>呼吸灯箭头</span></h1>
        <p class="desc">黑心白边箭头 + 圆形光晕，单一色相随时间流动、呼吸脉动</p>
        <p class="hint">左侧调节参数，与插件「设置 → 光标光效」完全一致</p>
      </div>
    </main>
  </div>

  <script>
  // ============================================================
  // 呼吸灯箭头（黑心白边 + 圆形呼吸光晕）
  // 单一色相随时间流动 + 呼吸脉动（scale/opacity）。
  // 效果逻辑与参数 schema 由 scripts/build.mjs 从 lib/glow.js 内联而来，
  // 与真实插件 lib/client.js 共用同一份实现，保证预览与插件一致。
  // ============================================================
  (function () {
    if (window.__cursorGlowInjected) return;
    window.__cursorGlowInjected = true;

    // ── 共享效果逻辑 + 参数 schema（由 scripts/build.mjs 内联自 lib/glow.js） ─
    /*__GLOW_CODE__*/

    const CONFIG = { ...DEFAULT_CONFIG };

    function fmt(v) {
      if (typeof v !== 'number') return String(v);
      if (Number.isInteger(v)) return String(v);
      return String(parseFloat(v.toFixed(2)));
    }

    // ── 注入样式 ──
    const style = document.createElement('style');
    document.head.appendChild(style);

    // ── 自定义箭头 ──
    const arrow = document.createElement('div');
    arrow.id = 'cursor-glow-arrow';
    arrow.setAttribute('aria-hidden', 'true');
    arrow.innerHTML = arrowMarkup(CONFIG);
    document.body.appendChild(arrow);
    const halo = arrow.querySelector('.halo');
    const path = arrow.querySelector('path');

    function applySvg(cfg) {
      path.setAttribute('fill', cfg.arrowFill);
      path.setAttribute('fill-opacity', String(cfg.arrowFillOpacity));
      path.setAttribute('stroke', cfg.arrowStroke);
      path.setAttribute('stroke-opacity', String(cfg.arrowStrokeOpacity));
      path.setAttribute('stroke-width', String(cfg.arrowStrokeWidth));
    }

    function applyConfig() {
      style.textContent = buildCss(CONFIG);
      applySvg(CONFIG);
    }
    applyConfig();

    // ── 跟手 + 色相流动 ──
    let mouseX = -9999;
    let mouseY = -9999;

    function onMove(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      // 箭头精确跟手（尖端对齐）
      const tip = tipOffset(CONFIG);
      arrow.style.transform = 'translate(' + (mouseX - tip) + 'px, ' + (mouseY - tip) + 'px)';
    }

    function tick() {
      // 光晕色相随时间流动（单一色相，彩虹循环）
      const hue = hueAt(performance.now(), CONFIG.hueCycleMs);
      halo.style.background = haloBackground(hue);
      requestAnimationFrame(tick);
    }

    window.addEventListener('mousemove', onMove, { passive: true });
    tick();

    // ── 参数调节面板（与设置面板共用同一份 PARAM_GROUPS） ───────────────────
    const panel = document.getElementById('panel');
    const controls = [];

    PARAM_GROUPS.forEach(group => {
      const sec = document.createElement('section');
      sec.className = 'group';

      const title = document.createElement('h4');
      title.className = 'group-title';
      title.textContent = group.title;
      sec.appendChild(title);

      group.fields.forEach(f => {
        const field = document.createElement('label');
        field.className = 'field';

        const name = document.createElement('span');
        name.className = 'field-name';
        const nameText = document.createElement('span');
        nameText.className = 'field-label';
        nameText.textContent = f.label;
        name.appendChild(nameText);
        if (f.hint) {
          const hint = document.createElement('span');
          hint.className = 'field-hint';
          hint.textContent = f.hint;
          name.appendChild(hint);
        }

        const value = document.createElement('span');
        value.className = 'field-value';

        const top = document.createElement('span');
        top.className = 'field-top';
        top.appendChild(name);
        top.appendChild(value);
        field.appendChild(top);

        const input = document.createElement('input');
        input.type = f.type === 'color' ? 'color' : 'range';
        if (input.type === 'range') {
          input.min = String(f.min);
          input.max = String(f.max);
          input.step = String(f.step);
        }
        input.value = String(CONFIG[f.key]);
        input.addEventListener('input', () => {
          CONFIG[f.key] = f.type === 'color' ? input.value : Number(input.value);
          value.textContent = f.type === 'color' ? input.value : fmt(CONFIG[f.key]) + (f.unit || '');
          applyConfig();
        });
        field.appendChild(input);

        value.textContent = f.type === 'color' ? CONFIG[f.key] : fmt(CONFIG[f.key]) + (f.unit || '');
        sec.appendChild(field);
        controls.push({ f, input, value });
      });

      panel.appendChild(sec);
    });

    const reset = document.createElement('button');
    reset.className = 'reset';
    reset.textContent = '恢复默认';
    reset.addEventListener('click', () => {
      Object.assign(CONFIG, DEFAULT_CONFIG);
      applyConfig();
      controls.forEach(c => {
        c.input.value = String(CONFIG[c.f.key]);
        c.value.textContent = c.f.type === 'color' ? CONFIG[c.f.key] : fmt(CONFIG[c.f.key]) + (c.f.unit || '');
      });
    });
    panel.appendChild(reset);

    // 停止并清理（调试用）
    window.__cursorGlowStop = function () {
      window.removeEventListener('mousemove', onMove);
      style.remove();
      arrow.remove();
      window.__cursorGlowInjected = false;
    };
  })();
  </script>
</body>
</html>
