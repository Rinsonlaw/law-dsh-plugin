<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>呼吸灯箭头 · 预览</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
      background: radial-gradient(1200px 800px at 50% -10%, #1e293b, #0b1120 60%);
      color: #e2e8f0;
      overflow: hidden;
    }
    .card {
      text-align: center;
      padding: 48px 56px;
      border: 1px solid rgba(148,163,184,.15);
      border-radius: 20px;
      background: rgba(15,23,42,.5);
      backdrop-filter: blur(6px);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.6);
    }
    h1 { font-size: 32px; font-weight: 700; letter-spacing: -.5px; }
    h1 span {
      background: linear-gradient(90deg,#ff5e7e,#ff9d5c,#ffe95c,#5cff9d,#5cd6ff,#a35cff,#ff5cf0);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { margin-top: 14px; font-size: 15px; color: #94a3b8; }
    .hint { margin-top: 26px; font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <h1><span>呼吸灯箭头</span></h1>
    <p>黑心白边箭头 + 圆形光晕，单一色相随时间流动、呼吸脉动</p>
    <p class="hint">满意就告诉我；要调参（光晕大小 / 亮度 / 呼吸速度 / 色相流速）也可以说</p>
  </div>

  <script>
  // ============================================================
  // 呼吸灯箭头（黑心白边 + 圆形呼吸光晕）
  // 单一色相随时间流动 + 呼吸脉动（scale/opacity）。
  // 效果逻辑由 scripts/build.mjs 从 lib/glow.js 内联而来，
  // 与真实插件 lib/client.js 共用同一份实现，保证预览一致。
  // ============================================================
  (function () {
    if (window.__cursorGlowInjected) return;
    window.__cursorGlowInjected = true;

    // ── 共享效果逻辑（由 scripts/build.mjs 内联自 lib/glow.js） ────────────
    /*__GLOW_CODE__*/

    const CONFIG = { ...DEFAULT_CONFIG };

    // ── 注入样式 ──
    const style = document.createElement('style');
    style.textContent = buildCss(CONFIG);
    document.head.appendChild(style);

    // ── 自定义箭头 ──
    const arrow = document.createElement('div');
    arrow.id = 'cursor-glow-arrow';
    arrow.setAttribute('aria-hidden', 'true');
    arrow.innerHTML = arrowMarkup(CONFIG);
    document.body.appendChild(arrow);
    const halo = arrow.querySelector('.halo');

    let mouseX = -9999;
    let mouseY = -9999;

    function onMove(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      // 箭头精确跟手（尖端对齐）
      const tip = tipOffset(CONFIG);
      arrow.style.transform = 'translate(' + (mouseX - tip) + 'px, ' + (mouseY - tip) + 'px)';
    }

    function tick() {
      // 光晕色相随时间流动（单一色相，彩虹循环）
      const hue = hueAt(performance.now(), CONFIG.hueCycleMs);
      halo.style.background = haloBackground(hue);
      requestAnimationFrame(tick);
    }

    window.addEventListener('mousemove', onMove, { passive: true });
    tick();

    // 停止并清理（调试用）
    window.__cursorGlowStop = function () {
      window.removeEventListener('mousemove', onMove);
      style.remove();
      arrow.remove();
      window.__cursorGlowInjected = false;
    };
  })();
  </script>
</body>
</html>
